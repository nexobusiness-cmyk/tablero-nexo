<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: barra fija con marca Nexo + vistas (Hoy · Tablero · Eventos · Tiempos · Equipo); resumen arriba, detalle abajo; semáforo de urgencia y cronómetro en cada tarjeta */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --surface-2:#e8efe9; --line:#d4ded6;
  --fg:#0f2a20; --muted:#55695f; --accent:#0d8a5f; --accent-ink:#ffffff;
  --hero-bg:#0b2b1f; --hero-fg:#eaf7ef; --hero-muted:#a8c7b6; --hero-accent:#3ee09c;
  --bad:#c62f2f; --bad-bg:#fde8e6; --warn:#8a5300; --warn-bg:#fff1d6; --warn-line:#f0c46a;
  --night:#5b3fb8; --night-bg:#ece7fb; --ok:#0d8a5f; --ok-bg:#dcf3e8; --run:#d6336c; --run-bg:#fde4ee;
  --c-dir:#0d8a5f; --c-conta:#2563a8; --c-mkt:#b4467a; --c-proy:#7a5a2e; --c-bus:#0d8a5f; --c-pro:#c97a2b;
  --shadow:0 1px 2px rgba(15,42,32,.06),0 6px 18px rgba(15,42,32,.06);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07170f; --surface:#0d2219; --surface-2:#123026; --line:#1f4134;
  --fg:#e7f4ec; --muted:#93b3a3; --accent:#2fd391; --accent-ink:#04140c;
  --hero-bg:#0f3427; --hero-fg:#eaf7ef; --hero-muted:#a8c7b6; --hero-accent:#3ee09c;
  --bad:#ff7b72; --bad-bg:#3a1514; --warn:#f5d48a; --warn-bg:#2a2108; --warn-line:#6b5418;
  --night:#b9a4ff; --night-bg:#241a45; --ok:#2fd391; --ok-bg:#0f3324; --run:#ff7aa8; --run-bg:#3a1424;
  --c-dir:#2fd391; --c-conta:#6ea8ef; --c-mkt:#ee86b8; --c-proy:#d2ad74; --c-bus:#2fd391; --c-pro:#f0a65a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07170f; --surface:#0d2219; --surface-2:#123026; --line:#1f4134;
  --fg:#e7f4ec; --muted:#93b3a3; --accent:#2fd391; --accent-ink:#04140c;
  --hero-bg:#0f3427; --hero-fg:#eaf7ef; --hero-muted:#a8c7b6; --hero-accent:#3ee09c;
  --bad:#ff7b72; --bad-bg:#3a1514; --warn:#f5d48a; --warn-bg:#2a2108; --warn-line:#6b5418;
  --night:#b9a4ff; --night-bg:#241a45; --ok:#2fd391; --ok-bg:#0f3324; --run:#ff7aa8; --run-bg:#3a1424;
  --c-dir:#2fd391; --c-conta:#6ea8ef; --c-mkt:#ee86b8; --c-proy:#d2ad74; --c-bus:#2fd391; --c-pro:#f0a65a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(20px,2.6vw,26px);font-weight:800}
h3{font-size:16px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hero-accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px}
.brand small{display:block;font:500 12px var(--body);color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-size:14px;font-weight:600;text-decoration:none;padding:7px 12px;border-radius:9px;color:var(--muted)}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.nav .n{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700}
.bar-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.me small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.clock{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:99px;background:var(--ok-bg);color:var(--ok)}
.clock.off{background:var(--night-bg);color:var(--night)}
.clock i{width:8px;height:8px;border-radius:50%;background:currentColor}
.badge-admin{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--fg);color:var(--bg)}

/* comunes */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--fg);white-space:nowrap;line-height:1.6}
.pill.bad{background:var(--bad);color:#fff}
.pill.bad-soft{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.night{background:var(--night-bg);color:var(--night)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.rec{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.run{background:var(--run);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:600;font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--c,var(--accent));flex:none;border:2px solid var(--surface)}
.avs{display:inline-flex}
.avs .av+.av{margin-left:-8px}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.notice{padding:14px 16px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head p{margin:4px 0 0}

/* bienvenida / vincular */
.claim{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.claim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.claim-grid button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.claim-grid button:hover{border-color:var(--accent)}
.claim-grid button[disabled]{opacity:.45;cursor:default}
.claim-grid b{display:block;font-size:14px}.claim-grid small{display:block;font-size:12px;color:var(--muted)}

/* HOY */
.hello{margin-top:22px;background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.hello .eyebrow{color:var(--hero-accent)}
.hello h1{font-size:clamp(24px,3.6vw,36px);font-weight:800;line-height:1.1}
.hello p{margin:0;color:var(--hero-muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{all:unset;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat:hover{background:rgba(255,255,255,.11)}
.stat b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--hero-muted)}
.stat.bad b{color:#ff8f87}.stat.warn b{color:#ffd27a}.stat.night b{color:#c8b6ff}.stat.ok b{color:var(--hero-accent)}
.night-band{background:var(--night-bg);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.night-band h3{color:var(--night)}
.night-list{display:flex;flex-direction:column;gap:6px}
.night-item{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
.night-item b{flex:1;min-width:180px;font-size:14px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.person.yo{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.person-head{display:flex;gap:10px;align-items:center}
.person-head .av{width:36px;height:36px;font-size:13px}
.person-head div{min-width:0;flex:1}
.person-head b{display:block;font-size:15px}
.person-head small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-head .count{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.mini li{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:6px 8px;margin-inline:-8px;border-radius:8px;cursor:pointer}
.mini li:hover{background:var(--surface-2)}
.mini li span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .more{color:var(--muted);font-size:12.5px;cursor:pointer}
.sev{width:4px;align-self:stretch;border-radius:4px;background:var(--line);flex:none}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn-line)}.sev.night{background:var(--night)}
.running-now{font-size:12.5px;font-weight:700;color:var(--run);display:flex;gap:6px;align-items:center}
.running-now i,.tmr.on i{width:8px;height:8px;border-radius:50%;background:var(--run);display:inline-block}
@media (prefers-reduced-motion:no-preference){.running-now i,.tmr.on i{animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.25}}}

/* TABLERO */
.filters{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.board-scroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;min-width:1020px}
.col{background:var(--surface-2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 6px}
.col-head h3{font-size:15px}
.col-head .k{margin-left:auto;font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-head .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:7px;cursor:pointer;position:relative;box-shadow:var(--shadow);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.card.bad::before{background:var(--bad)}.card.warn::before{background:var(--warn-line)}.card.night::before{background:var(--night)}
.card.bad{background:color-mix(in srgb,var(--bad-bg) 55%,var(--surface))}
.card.running{border-color:var(--run);box-shadow:0 0 0 1px var(--run)}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.5}
.card.done{opacity:.7}
.card.done .ttl{text-decoration:line-through;text-decoration-color:var(--muted)}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
.card .ttl{font-weight:600;font-size:14.5px;line-height:1.35}
.card .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.card .foot .who{display:flex;align-items:center;gap:6px;margin-right:auto;min-width:0}
.card .foot .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .adv{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:var(--accent);padding:3px 7px;border-radius:7px;border:1px solid var(--line)}
.card .adv:hover{border-color:var(--accent)}
.tmr{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--surface-2);color:var(--fg);font-variant-numeric:tabular-nums}
.tmr.on{background:var(--run-bg);color:var(--run)}
.tmr.over{color:var(--bad)}
.tmr[disabled]{cursor:default}
.tline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tline .est{font-size:12px;color:var(--muted)}
.col .hint{font-size:12.5px;color:var(--muted);text-align:center;padding:14px 6px}

/* EVENTOS */
.portal-link{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:22px}
.evs{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-left:5px solid var(--c,var(--line))}
.ev.st-ok{--c:var(--ok)}.ev.st-warn{--c:var(--warn-line)}.ev.st-bad{--c:var(--bad)}
.date{text-align:center;display:flex;flex-direction:column;line-height:1.1}
.date small{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.date b{font-family:var(--display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.date span{font-size:12.5px;font-weight:600}
.ev-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.ev-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev-top h3{font-size:17px;margin-right:auto}
.ev .where{font-size:13px;color:var(--muted)}
.mats{display:flex;gap:6px;flex-wrap:wrap}
.mat{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.mat.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.mat.asig{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.mat.falta{border-color:var(--bad);color:var(--bad)}
.mat small{font-weight:500;opacity:.85}
.ev-acts{display:flex;gap:8px;flex-wrap:wrap}
.add-ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}

/* TIEMPOS */
.tsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.tcard .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tcard .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.dev-bad{color:var(--bad);font-weight:700}.dev-ok{color:var(--ok);font-weight:700}

/* EQUIPO */
.team{display:flex;flex-direction:column;gap:12px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.member-row{display:grid;grid-template-columns:36px minmax(0,1.2fr) minmax(0,1.6fr) 150px;gap:10px;align-items:center}
.member-row .av{width:36px;height:36px;font-size:13px}
.inp{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.inp:disabled{background:transparent;border-color:transparent;font-weight:600;padding-inline:0}
.link-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.rut{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.rut li{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:8px 10px;border-radius:9px;background:var(--surface-2);cursor:pointer;min-width:0}
.rut li span{flex:1;min-width:0}
.area-h{font-family:var(--display);font-weight:800;font-size:15px;margin:10px 0 0;color:var(--muted)}

/* modal */
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,12,8,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:580px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.f input,.f select,.f textarea{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}
.f textarea{min-height:70px;resize:vertical}
.f .chips label{font-size:13px;color:var(--fg);letter-spacing:0}

const proxHabil = () => { const d = new Date(), h = HORARIO[d.getDay()]; if (h && d.getHours() < h[0]) return today(); let x = today(); do { x = addDays(x,1); } while (!HORARIO[x.getDay()]); return x; };
const fmtCorto = s => { const d = parse(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const fmtDue = s => { if (!s) return ""; const n = diff(s); if (n===0) return "Hoy"; if (n===1) return "Mañana"; if (n===-1) return "Ayer"; if (n<0) return `Venció ${fmtCorto(s)}`; return fmtCorto(s); };
const fmtDur = seg => { seg = Math.max(0, Math.round(seg)); const h = Math.floor(seg/3600), m = Math.floor(seg%3600/60); if (h) return `${h} h ${pad(m)} min`; if (m) return `${m} min`; return `${seg} s`; };
const fmtReloj = seg => { seg = Math.max(0, Math.floor(seg)); return `${Math.floor(seg/3600)}:${pad(Math.floor(seg%3600/60))}:${pad(seg%60)}`; };

function inst(t){
  const f = t.freq || "una", d0 = today(), per = t.periodos || {};
  if (f === "una") return {t, key:"u", estado:t.estado||"todo", due:t.fecha ? String(t.fecha).slice(0,10) : "", rec:false};
  if (f === "diaria") { if (!HORARIO[d0.getDay()]) return null; const k = "d:"+ymd(d0); return {t,key:k,estado:per[k]||"todo",due:ymd(d0),rec:true}; }
  if (f === "semanal") { const mon = mondayOf(d0), k = "w:"+ymd(mon); return {t,key:k,estado:per[k]||"todo",due:ymd(addDays(mon,((t.dia ?? 1)+6)%7)),rec:true}; }
  if (f === "mensual") { const y=d0.getFullYear(), m=d0.getMonth(), last=new Date(y,m+1,0).getDate(); const k = `m:${y}-${pad(m+1)}`; return {t,key:k,estado:per[k]||"todo",due:ymd(new Date(y,m,Math.min(t.dia||1,last))),rec:true}; }
  return null;
}
function instancias(){
  const out = [];
  for (const t of S.tasks) {
    const i = inst(t); if (!i) continue;
    if (!i.rec && i.estado === "done" && t.hechoEn && (Date.now() - Date.parse(t.hechoEn)) > 7*864e5) continue;
    out.push(i);
  }
  return out;
}
function nivel(i){
  if (i.estado === "done") return "";
  if (i.due && diff(i.due) < 0) return "bad";
  if (i.t.prio === "urgente") return "bad";
  if (i.t.fuera && !i.t.visto) return "night";
  if (i.due && diff(i.due) <= 1) return "warn";
  return "";
}
function orden(a,b){
  const w = i => (nivel(i)==="bad"?0:nivel(i)==="night"?1:nivel(i)==="warn"?2:3);
  return w(a)-w(b) || (a.due||"9999").localeCompare(b.due||"9999") || (a.t.prio==="alta"?-1:0)-(b.t.prio==="alta"?-1:0);
}

const corriendo = (t, key) => t.timer && t.timer.desde && (key == null || t.timer.key === key);
const segDe = (t, key) => ((t.tiempos||{})[key] || 0) + (corriendo(t,key) ? (ahora() - Date.parse(t.timer.desde))/1000 : 0);
async function playPause(i){

}
function tmrHtml(i){
  const t = i.t; if (!t.trabajo) return "";
  const on = corriendo(t, i.key), seg = segDe(t, i.key), est = (t.estimado||0)*60, over = est && seg > est;
  const dis = puedeMover(t) && i.estado!=="done" ? "" : "disabled";
  return `<div class="tline"><button class="tmr ${on?"on":""} ${over?"over":""}" type="button" data-tmr="${esc(t.id)}" ${dis} title="${on?"Pausar":"Iniciar"} cronómetro">${on?"<i></i> ⏸":"▶"} <span data-live="${esc(t.id)}" data-key="${esc(i.key)}">${on?fmtReloj(seg):fmtDur(seg)}</span></button>${est?`<span class="est">de ${fmtDur(est)} estimado</span>`:""}<span class="pill rec">${esc(TRABAJO[t.trabajo]||"")}</span></div>`;
}

function ocurrencias(dias = 21){
  const out = [], d0 = today();
  for (const ev of S.events) {
    if (ev.repite === "semanal") {
      for (let i=0;i<=dias;i++){ const d = addDays(d0,i); if (d.getDay() === ev.dia) out.push({ev, date:ymd(d), hora:ev.hora||"", key:`${ev.id}__${ymd(d)}`}); }
    } else if (ev.inicio) {
      const d = new Date(ev.inicio), dd = new Date(d); dd.setHours(0,0,0,0);
      const n = Math.round((dd-d0)/864e5);
      if (n>=0 && n<=dias) out.push({ev, date:ymd(dd), hora:`${pad(d.getHours())}:${pad(d.getMinutes())}`, key:`${ev.id}__${ymd(dd)}`});
    }
  }
  return out.sort((a,b)=> (a.date+a.hora).localeCompare(b.date+b.hora));
}
function matEstado(o, item){
  if ((S.mat[o.key]||{})[item]) return {s:"ok"};
  const t = S.tasks.find(t => t.evento===o.key && t.mat===item);
  if (t) return t.estado==="done" ? {s:"ok", t} : {s:"asig", t};
  return {s:"falta"};
}
function matResumen(o){
  const items = o.ev.mat || [];
  const faltan = items.filter(k => matEstado(o,k).s !== "ok");
  return {items, faltan, st: !faltan.length ? "ok" : (diff(o.date)<=2 ? "bad" : "warn")};
}

async function asignarFaltantes(o){

function agendaDe(pid, dias){
  const hoy = today(), out = [], atras = [];
  const mias = S.tasks.filter(t => equipoDe(t).includes(pid));
  for (const t of mias) {
    const f = t.freq || "una";
    if (f === "una") { if ((t.estado||"todo") === "done" || !t.fecha) continue; const d = parse(t.fecha), n = diff(t.fecha); if (n < 0) atras.push({t, d}); else if (n < dias) out.push({t, d}); continue; }
    for (let k = 0; k < dias; k++) {
      const d = addDays(hoy, k); let toca = false, key = "";
      if (f === "diaria") { toca = !!HORARIO[d.getDay()]; key = "d:" + ymd(d); }
      if (f === "semanal") { toca = d.getDay() === (t.dia ?? 1); key = "w:" + ymd(mondayOf(d)); }
      if (f === "mensual") { const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); toca = d.getDate() === Math.min(t.dia||1, last); key = `m:${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
      if (toca && ((t.periodos||{})[key]||"todo") !== "done") out.push({t, d});
    }
  }
  return {atras, out};
}

function rangoRep(){
  const d0 = today();
  if (S.rp === "mes") return [new Date(d0.getFullYear(), d0.getMonth(), 1), new Date(d0.getFullYear(), d0.getMonth()+1, 1), "Este mes"];
  if (S.rp === "mespas") return [new Date(d0.getFullYear(), d0.getMonth()-1, 1), new Date(d0.getFullYear(), d0.getMonth(), 1), "Mes pasado"];
  const mon = mondayOf(d0);
  if (S.rp === "sempas") return [addDays(mon,-7), mon, "Semana pasada"];
  return [mon, addDays(mon,7), "Esta semana"];
}
function ocRango(t, ini, fin){
  const out = [], f = t.freq || "una", per = t.periodos || {}, hz = t.hechos || {}, hoy = today();
  const creado = t.creado ? new Date(new Date(t.creado).setHours(0,0,0,0)) : new Date(2000,0,1);
  const dentro = d => d >= ini && d < fin;
  if (f === "una") {
    const due = t.fecha ? parse(t.fecha) : null, hecho = t.hechoEn || hz.u || "";
    if ((due && dentro(due)) || (!due && ((hecho && dentro(new Date(hecho))) || dentro(creado)))) out.push({key:"u", due: due ? ymd(due) : "", estado: t.estado || "todo", hecho});
    return out;
  }
  if (f === "diaria") { for (let d = new Date(ini); d < fin && d <= hoy; d = addDays(d,1)) if (HORARIO[d.getDay()] && d >= creado) { const k = "d:"+ymd(d); out.push({key:k, due:ymd(d), estado:per[k]||"todo", hecho:hz[k]||""}); } return out; }
  if (f === "semanal") { for (let mon = mondayOf(ini); mon < fin; mon = addDays(mon,7)) { const due = addDays(mon, ((t.dia ?? 1)+6)%7); if (dentro(due) && due <= hoy && due >= creado) { const k = "w:"+ymd(mon); out.push({key:k, due:ymd(due), estado:per[k]||"todo", hecho:hz[k]||""}); } } return out; }
  if (f === "mensual") { for (let m = new Date(ini.getFullYear(), ini.getMonth(), 1); m < fin; m = new Date(m.getFullYear(), m.getMonth()+1, 1)) { const last = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate(); const due = new Date(m.getFullYear(), m.getMonth(), Math.min(t.dia||1,last)); if (dentro(due) && due <= hoy && due >= creado) { const k = `m:${m.getFullYear()}-${pad(m.getMonth()+1)}`; out.push({key:k, due:ymd(due), estado:per[k]||"todo", hecho:hz[k]||""}); } } return out; }
  return out;
}
function datosReporte(){
  const [ini, fin, etiqueta] = rangoRep(), hoyS = ymd(today()), por = {}, det = [];
  const fila = id => por[id] || (por[id] = {asig:0, hechas:0, tiempo:0, tarde:0, venc:0, pend:0, seg:0, avs:0});
  for (const t of S.tasks) {
    if (t.privado) continue;
    for (const o of ocRango(t, ini, fin)) {
      const hecha = o.estado === "done", hechoD = o.hecho ? ymd(new Date(o.hecho)) : "";
      const st = hecha ? (!o.due || !hechoD || hechoD <= o.due ? "A tiempo" : "Tarde") : (o.due && o.due < hoyS ? "Vencida sin hacer" : "Pendiente");
      for (const id of equipoDe(t)) {
        if (S.rpp !== "all" && id !== S.rpp) continue;
        const r = fila(id); r.asig++; if (hecha) r.hechas++; if (st==="A tiempo") r.tiempo++; if (st==="Tarde") r.tarde++; if (st==="Vencida sin hacer") r.venc++; if (st==="Pendiente") r.pend++;
        det.push({id, t, o, st, hechoD});
      }
    }
    for (const a of (t.avances||[])) { const d = new Date(a.en); if (d >= ini && d < fin && a.por && (S.rpp==='all' || a.por===S.rpp)) fila(a.por).avs++; }
    for (const se of (t.sesiones||[])) { const d = new Date(se.ini); if (d >= ini && d < fin && se.por && (S.rpp==="all" || se.por===S.rpp)) fila(se.por).seg += se.seg; }
  }
  const filas = sorted().filter(m => por[m.id]).map(m => ({m, ...por[m.id], pct: (por[m.id].asig - por[m.id].pend) ? Math.round(por[m.id].tiempo / (por[m.id].asig - por[m.id].pend) * 100) : null}));
  return {ini, fin, etiqueta, filas, det};
}

    ${t && i.estado!=="done" && equipoDe(t).some(x => x !== S.soy && (S.admin || S.veIds.includes(x))) ? `<div class="timebox" style="background:var(--warn-bg)"><div style="flex:1;min-width:200px"><b style="font-size:14px">🔔 Recordarle a ${esc(equipoDe(t).filter(x=>x!==S.soy).map(x=>corto(member(x))).join(", "))}</b><input id="rc-n" class="inp" style="margin-top:6px" placeholder="Mensaje opcional (ej. Lo necesito antes de las 4 pm)"></div><button class="btn solid" type="button" id="rc-b">Enviar recordatorio</button>${t.recordado?`<span class="muted" style="font-size:12px;flex-basis:100%">Último recordatorio: ${esc(fmtCorto(ymd(new Date(t.recordado.en))))} ${pad(new Date(t.recordado.en).getHours())}:${pad(new Date(t.recordado.en).getMinutes())}</span>`:""}</div>` : ""}
    <div class="modal-foot"><div>${t && puedeBorrar(t)?`<button class="btn danger" type="button" id="del">Eliminar</button>`:""}</div><div style="display:flex;gap:8px"><button class="btn" type="button" id="cx2">${edit?"Cancelar":"Cerrar"}</button>${edit?`<button class="btn solid" type="submit" id="sv">${t?"Guardar":"Agregar"}</button>`:""}</div></div>
  </form></div>`;
  const fq = $("#f-freq"), fd = $("#f-dia"), ft = $("#f-trabajo");
  const sync = () => {
    const f = fq.value; $("#w-fecha").hidden = f!=="una"; $("#w-dia").hidden = !(f==="semanal"||f==="mensual"); $("#w-est").hidden = !ft.value;
    if (f==="semanal") { $("#l-dia").textContent = "Qué día"; fd.innerHTML = [1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${d===(v.dia??1)?"selected":""}>${DIAS_L[d]}</option>`).join(""); }
    if (f==="mensual") { $("#l-dia").textContent = "Día del mes"; fd.innerHTML = Array.from({length:31},(_,k)=>k+1).map(d=>`<option value="${d}" ${d===(v.dia||1)?"selected":""}>${d}</option>`).join(""); }
  };
  fq.onchange = sync; ft.onchange = sync; sync();
  $("#f-resp").onchange = e => { if (!ft.value) { if (e.target.value==="disenadora") ft.value="diseno"; if (e.target.value==="filmmaker") ft.value="video"; sync(); } };

  let links = (t?.links || []).slice();
  const puedeLink = edit || mueve;
  const host = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } };
  const pintaLinks = () => {
    $("#lk-list").innerHTML = links.length ? links.map((k,n)=>`<div class="lk"><a href="${esc(k.u)}" target="_blank" rel="noopener">${esc(k.l||host(k.u))} ↗</a><small>${esc(host(k.u))}${k.por&&member(k.por)?` · ${esc(corto(member(k.por)))}`:""}</small>${puedeLink?`<button type="button" data-lkdel="${n}" aria-label="Quitar link">×</button>`:""}</div>`).join("") : `<span class="muted" style="font-size:13px">Sin links todavía.</span>`;
  };
  const guardaLinks = async () => { pintaLinks(); if (t) { try { await API("links", {id:t.id, links}); } catch(e){} } };
  pintaLinks();
  $("#lk-list").onclick = async e => { const b = e.target.closest("[data-lkdel]"); if (!b) return; links.splice(Number(b.dataset.lkdel),1); await guardaLinks(); };
  if ($("#lk-btn")) $("#lk-btn").onclick = async () => {
    let u = $("#lk-u").value.trim(); const l = $("#lk-l").value.trim();
    if (!u) { $("#lk-u").focus(); toast("Pega la dirección del link"); return; }
    if (!/^https?:[\/][\/]/i.test(u)) u = "https:\/\/" + u;
    if (!host(u)) { $("#lk-u").focus(); toast("Esa dirección no parece un link válido"); return; }
    links.push({l, u, por:S.soy||""}); $("#lk-u").value = ""; $("#lk-l").value = "";
    await guardaLinks(); if (t) toast("Link agregado");
  };
  const close = () => { $("#ovRoot").innerHTML = ""; };
  const pintaAvances = () => {
    const box = $("#av-list"); if (!box || !t) return;
    const tt = S.tasks.find(x => x.id === t.id) || t, avs = (tt.avances || []).slice().reverse();
    box.innerHTML = avs.length ? avs.map(a => { const m = member(a.por); return `<div class="av-item">${avHtml(m)}<div class="bub"><small><b>${esc(m?.nombre||"")}</b> · ${esc(horaDe(a.en))}${a.por===S.soy || S.admin ? ` · <button class="del" type="button" data-avdel="${esc(a.id)}">Borrar</button>` : ""}</small>${a.texto?`<p>${esc(a.texto)}</p>`:""}${a.archivo && a.archivo.thumb ? `<a href="${esc(a.archivo.url)}" target="_blank" rel="noopener"><img src="${esc(a.archivo.thumb)}" alt="${esc(a.archivo.nombre)}" loading="lazy"></a>` : ""}${a.archivo ? `<a href="${esc(a.archivo.url)}" target="_blank" rel="noopener">📎 ${esc(a.archivo.nombre)} ↗</a>` : ""}${a.link ? `<a href="${esc(a.link)}" target="_blank" rel="noopener">🔗 ${esc(a.link.replace(/^https?:./i,"").replace(/^[\/]+/,"").slice(0,60))} ↗</a>` : ""}</div></div>`; }).join("") : `<span class="muted" style="font-size:13px">Todavía no hay avances. Cuenta qué hiciste y adjunta una foto, documento o link.</span>`;
  };
  pintaAvances();
  if ($("#av-list")) $("#av-list").onclick = async e => { const b = e.target.closest("[data-avdel]"); if (!b) return; if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro?"; return; } try { await API("borrarAvance", {id:t.id, av:b.dataset.avdel}); pintaAvances(); toast("Avance borrado"); } catch(err){} };
  if ($("#av-b")) $("#av-b").onclick = async () => {
    const b = $("#av-b"), texto = $("#av-t").value.trim(), f = $("#av-f").files[0]; let link = $("#av-l").value.trim();
    if (link && !/^https?:/i.test(link)) link = "https:" + "\/\/" + link;
    if (!texto && !link && !f) { $("#av-t").focus(); toast("Escribe qué hiciste o adjunta una evidencia"); return; }
    if (f && f.size > 10*1024*1024) { toast("El archivo pesa más de 10 MB. Súbelo a Drive y pega el link."); return; }
    b.disabled = true; b.textContent = f ? "Subiendo archivo…" : "Guardando…";
    try {
      let archivo = null;
      if (f) archivo = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({nombre:f.name, tipo:f.type, datos:String(r.result).split(",")[1]}); r.onerror = rej; r.readAsDataURL(f); });
      await API("avance", {id:t.id, texto, link, archivo});
      $("#av-t").value = ""; $("#av-l").value = ""; $("#av-f").value = ""; pintaAvances(); toast("Avance subido 📎");
    } catch(err){} finally { b.disabled = false; b.textContent = "Subir avance"; }
  };
  if ($("#rc-b")) $("#rc-b").onclick = async () => { const b = $("#rc-b"); b.disabled = true; b.textContent = "Enviando…"; try { await API("recordar", {id:t.id, nota:$("#rc-n").value}); toast("Recordatorio enviado 🔔"); close(); } catch(e){ b.disabled = false; b.textContent = "Enviar recordatorio"; } };
  $("#cx").onclick = close; $("#cx2").onclick = close;
  $("#ov").onclick = e => { if (e.target.id==="ov") close(); };
  if ($("#visto")) $("#visto").onclick = async () => { try { await API("visto", {id:t.id}); close(); } catch(e){} };
  if ($("#mtmr")) $("#mtmr").onclick = async () => { close(); await playPause(i); };
  if (i && $("#seg")) $("#seg").onclick = async e => { const b = e.target.closest("[data-st]"); if (!b || b.disabled) return; close(); await setEstado(i, b.dataset.st); };
  if ($("#del")) $("#del").onclick = async e => {
    const b = e.currentTarget; if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro? Eliminar"; return; }
    try { await API("borrar", {id:t.id}); toast("Eliminada"); close(); } catch(err){}
  };
  $("#tf").onsubmit = async e => {
    e.preventDefault(); if (!edit) return;
    const titulo = $("#f-titulo").value.trim(); if (!titulo) { $("#f-titulo").focus(); toast("Escribe qué hay que hacer"); return; }
    const resp = $("#f-resp").value; if (!resp) { $("#f-resp").focus(); toast("Elige un responsable"); return; }
    const f = fq.value;
    const con = ms.map(m=>m.id).filter(id => id!==resp && $("#fc-"+id)?.checked);
    const data = { titulo, resp, con, empresa:$("#f-empresa").value, prio:$("#f-prio").value, freq:f, dia: (f==="semanal"||f==="mensual") ? Number(fd.value) : 0,
      fecha: f==="una" ? $("#f-fecha").value : "", evento:$("#f-evento").value, nota:$("#f-nota").value.trim(), privado: $("#f-priv") ? $("#f-priv").checked : !!(t && t.privado), trabajo:ft.value, estimado: ft.value ? Number($("#f-est").value||0) : 0 };
    const sv = $("#sv"); sv.disabled = true; sv.textContent = "Guardando…";
    try {
      await API("guardar", t ? {id:t.id, data, key:i.key, ajuste: $("#f-ajuste") ? $("#f-ajuste").value : null} : {data:{...data, links}});
      toast(t ? "Guardado" : (enHorario() ? "Pendiente agregado" : "Pendiente dejado para el siguiente día hábil ☾")); close();
    } catch(err){ sv.disabled = false; sv.textContent = t?"Guardar":"Agregar"; }
  };
  setTimeout(()=> { if (!t) $("#f-titulo").focus(); }, 30);
}

document.addEventListener("submit", async e => {
  if (e.target.id === "recf") {
    e.preventDefault(); const texto = $("#rf-t").value.trim(); if (!texto) { $("#rf-t").focus(); toast("Escribe qué hay que recordar"); return; }
    const f = $("#rf-f").value, hh = $("#rf-h").value || "09:00"; if (!f) { $("#rf-f").focus(); toast("Elige la fecha"); return; }
    const cuando = new Date(f + "T" + hh + ":00"); if (cuando.getTime() < Date.now() - 60000) { toast("Esa hora ya pasó. Elige una más adelante."); return; }
    const b = e.target.querySelector("button"); b.disabled = true;
    try { await API("programar", {texto, cuando: cuando.toISOString(), repite: $("#rf-r").value, para: $("#rf-p").value}); toast("Recordatorio programado ⏰"); $("#rf-t").value = ""; if (document.activeElement) document.activeElement.blur(); render(); } catch(err){ b.disabled = false; }
    return;
  }
  if (e.target.id === "nf") {
    e.preventDefault(); const titulo = $("#n-t").value.trim(); if (!titulo) { $("#n-t").focus(); toast("Escribe la nota"); return; }
    const para = $("#n-p").value, dir = direccion().map(m => m.id);
    const resp = para === "ambas" ? S.soy : para, con = para === "ambas" ? dir.filter(x => x !== S.soy) : [];
    try { await API("guardar", {data:{titulo, resp, con, empresa:"ambas", prio:"normal", freq:"una", dia:0, fecha:$("#n-f").value, evento:"", nota:"", privado:true, trabajo:"", estimado:0, links:[]}}); toast("Nota guardada 📌"); } catch(err){}
    return;
  }
  if (e.target.id === "lf") {
    e.preventDefault(); const b = $("#l-b"); b.disabled = true; b.textContent = "Entrando…";
    try { await API("login", {usuario:$("#l-u").value, clave:$("#l-c").value}); S.f.p = null; await API("load"); }
    catch(err){ b.disabled = false; b.textContent = "Entrar"; }
    return;
  }
  const af = e.target.closest?.("[data-accf]");
  if (af) {
    e.preventDefault(); const id = af.dataset.accf;
    const usuario = $("#au-"+id).value.trim().toLowerCase(), clave = $("#ac-"+id).value;
    try { await API("acceso", {id, usuario, clave}); toast("Acceso guardado"); const box = $("#accbox-"+id); if (box) box.innerHTML = ""; render(); }
    catch(err){}
  }
});
document.addEventListener("click", async e => {

  if (e.target.id === "tg-off") { try { await API("tgQuitar"); $("#npanel").hidden = true; toast("Ya no te llegarán por Telegram"); } catch(err){} return; }
  const pv = e.target.closest("[data-pop-ver]"); if (pv) { const id = pv.dataset.popVer; pv.closest(".pop")?.remove(); if (id) openTask(id); else location.hash = "tablero"; return; }

  if (e.target.id === "salir") { try { await API("salir"); } catch(err){} return; }
  const ac = e.target.closest("[data-acc]"); if (ac) { abrirAcceso(ac.dataset.acc); return; }
  const qu = e.target.closest("[data-quitar]"); if (qu) { if (qu.dataset.sure!=="1") { qu.dataset.sure="1"; qu.textContent="¿Seguro? Quitar"; return; } try { await API("quitarAcceso", {id:qu.dataset.quitar}); toast("Acceso quitado"); } catch(err){} return; }
  const tm = e.target.closest("[data-tmr]");
  if (tm) { e.stopPropagation(); if (tm.disabled) return; const t = S.tasks.find(x=>x.id===tm.dataset.tmr); if (t) playPause(inst(t)); return; }
  const adv = e.target.closest("[data-adv]");
  if (adv) { e.stopPropagation(); const c = adv.closest("[data-id]"); const t = S.tasks.find(x=>x.id===c.dataset.id); if (t) setEstado(inst(t), adv.dataset.adv); return; }
  const mt = e.target.closest("[data-mat]");

  const as = e.target.closest("[data-asig]");
  if (as) { const o = ocurrencias(21).find(o => o.key===as.dataset.asig); if (o) { as.disabled = true; await asignarFaltantes(o); } return; }
  const nr = e.target.closest("[data-newrut]"); if (nr) { openTask(null, {resp:nr.dataset.newrut, freq:"semanal"}); return; }
  const pr = e.target.closest("[data-person]"); if (pr) { S.f.p = pr.dataset.person; location.hash = "tablero"; return; }

  const fp = e.target.closest("[data-fp]"); if (fp) { S.f.p = fp.dataset.fp; render(); return; }
  const fe = e.target.closest("[data-fe]"); if (fe) { S.f.e = fe.dataset.fe; render(); return; }

});
document.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.classList?.contains("card")) openTask(e.target.dataset.id); if (e.key==="Escape") $("#ovRoot").innerHTML = ""; });
document.addEventListener("input", e => { if (e.target.id==="q") { S.f.q = e.target.value; clearTimeout(render._q); render._q = setTimeout(render, 150); } });
document.addEventListener("change", async e => {
  const vb = e.target.closest?.("[data-vebox]"); if (vb && S.admin) { const valor = [...vb.querySelectorAll("input:checked")].map(x => x.value).join(","); try { await API("miembro", {id:vb.dataset.vebox, campo:"ve", valor}); toast("Permisos de vista guardados"); } catch(err){} return; }
  if (e.target.id === "agp") { S.agp = e.target.value; render(); return; }
  if (e.target.id === "rpp") { S.rpp = e.target.value; S.repUrl = ""; render(); return; }
  const mf = e.target.dataset?.mf; if (mf && S.admin) { const val = e.target.value.trim(); if (mf==="nombre" && !val) return; try { await API("miembro", {id:e.target.dataset.m, campo:mf, valor:val}); toast("Guardado"); } catch(err){} }
});
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest?.(".card"); if (!c || c.getAttribute("draggable")!=="true") return; dragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch(err){} });
document.addEventListener("dragend", () => { document.querySelectorAll(".dragging,.drop").forEach(x => x.classList.remove("dragging","drop")); });
document.addEventListener("dragover", e => { const col = e.target.closest?.(".col"); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll(".drop").forEach(x => x!==col && x.classList.remove("drop")); col.classList.add("drop"); });
document.addEventListener("drop", e => { const col = e.target.closest?.(".col"); if (!col || !dragId) return; e.preventDefault(); const t = S.tasks.find(x=>x.id===dragId); dragId = null; if (t) { const i = inst(t); if (i && i.estado !== col.dataset.col) setEstado(i, col.dataset.col); } });
$("#fab").onclick = () => openTask(null);

function addEvForm(){
  const box = $("#addEvBox"); if (box.innerHTML) { box.innerHTML = ""; return; }
  box.innerHTML = `<form class="add-ev" id="evf" novalidate style="margin-bottom:12px"><div class="fgrid">
    <div class="f full"><label for="e-t">Nombre del evento</label><input id="e-t" placeholder="Ej. Cóctel de inversionistas"></div>
    <div class="f"><label for="e-f">Fecha</label><input id="e-f" type="date" value="${ymd(addDays(today(),3))}"></div>
    <div class="f"><label for="e-h">Hora</label><input id="e-h" type="time" value="19:00"></div>
    <div class="f"><label for="e-tp">Tipo</label><select id="e-tp">${Object.entries(TIPOS).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
    <div class="f"><label for="e-l">Lugar</label><input id="e-l" placeholder="Zoom, oficina…"></div>
    <div class="f full"><span class="lbl">Material que necesita</span><div class="chips">${Object.entries(MAT).map(([k,m])=>`<label class="chip"><input type="checkbox" id="em-${k}" value="${k}" ${["flyer","invitacion"].includes(k)?"checked":""}> ${m.l}</label>`).join("")}</div></div>
  </div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn solid" type="submit">Guardar evento</button></div></form>`;
  $("#evf").onsubmit = async e => {
    e.preventDefault(); const t = $("#e-t").value.trim(); if (!t) { $("#e-t").focus(); toast("Escribe el nombre del evento"); return; }
    const mat = Object.keys(MAT).filter(k => $("#em-"+k).checked);
    try { await API("evento", {titulo:t, tipo:$("#e-tp").value, inicio:`${$("#e-f").value}T${$("#e-h").value}:00-05:00`, lugar:$("#e-l").value.trim(), mat}); toast("Evento agregado"); box.innerHTML = ""; } catch(err){}
  };
}

function route(){ const h = location.hash.replace("#",""); S.view = ["hoy","agenda","tablero","eventos","tiempos","equipo","reportes"].includes(h) ? h : "hoy"; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);
setInterval(() => { if (S.auth && !$("#ovRoot").innerHTML && (document.visibilityState === "visible" || permisoNotif() === "granted")) API("load").catch(()=>{}); }, 20000);
document.addEventListener("visibilitychange", () => { if (S.auth && document.visibilityState === "visible") API("load").catch(()=>{}); });
route();
const vigia = setTimeout(() => { if (S.auth === null) $("#app").innerHTML = `<div class="notice" style="margin-top:28px"><b>El servidor de Google no responde.</b><br>Esto pasa casi siempre cuando hay <b>varias cuentas de Google abiertas</b> en el mismo navegador. Prueba abrir este link en una ventana de incógnito (Ctrl + Shift + N) o en un perfil de Chrome con una sola cuenta.</div>`; }, 15000);
if (copiaPrevia && copiaPrevia.auth) aplicar(copiaPrevia);
try { const qt = new URLSearchParams(location.search).get("tarea"); if (qt) setTimeout(() => { if (S.tasks.some(t => t.id === qt)) openTask(qt); }, 1500); } catch(e){}
API("load").catch(() => { if (S.auth) { toast("Sin conexión: estás viendo la última copia guardada."); return; } $("#app").innerHTML = `<div class="notice" style="margin-top:28px">No se pudo cargar el tablero. Si eres Camila, revisa que hayas ejecutado "instalar" en Apps Script.</div>`; });
})();
</script>
